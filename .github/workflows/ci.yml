name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Format, lint and test
        run: >-
          nix develop -c bash -c
          'cargo-fmt --all --check
          && cargo-clippy clippy --all-targets -- -D warnings
          && cargo test'
      - name: Build
        run: nix build .#obsidian-brain
